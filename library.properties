name=QuarkDB
version=1.1.0
author=Anirban xxxxxxxxxxxxxxxxx
maintainer=xxxxxxxxxxxxxxxxxxxxxxxx
sentence=A No-SQL Json Document DB based on ArduinoJson with command line interface, APIs and MQTT cloud backup for esp8266 and esp32 using SPIFFS
paragraph=This library can be used in esp32 and esp8266 boards using SPIFFS file system. Once can create/delete/update documents in a list using APIs or command line interface in the serial interface to work like any other DB prompt using QUARKDB>. Lists can be backed up to the cloud over MQTT (PubSubClient or any client behind the QuarkTransport interface), with an oplog for offline changes and restore from the cloud copy.
url=https://qstream.quarkifi.com/quarkdb
category=Data Storage
depends=ArduinoJson
architectures=esp8266,esp32
includes=QuarkDB.h
